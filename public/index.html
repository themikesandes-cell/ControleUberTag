<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Visitas &amp; Uber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens ============ */
:root{
  --paper:#F8FAF9;
  --surface:#FFFFFF;
  --ink:#12191B;
  --ink-soft:#4C5B5E;
  --ink-faint:#8B9A9C;
  --line:#E2E8E6;
  --line-strong:#CBD6D3;
  --brand:#0F5C56;
  --brand-ink:#0B211F;
  --brand-soft:#E4F0EE;
  --accent:#C98A2C;
  --accent-soft:#FBF0DD;
  --amarelo:#B9791A;
  --amarelo-bg:#FCF2DF;
  --amarelo-line:#F0D9A8;
  --verde:#1F7A4D;
  --verde-bg:#E7F5ED;
  --verde-line:#B9E0C9;
  --vermelho:#B23A34;
  --vermelho-bg:#FBEAE9;
  --vermelho-line:#F0C2BF;
  --shadow-1: 0 1px 2px rgba(15,30,28,.06);
  --shadow-2: 0 8px 24px rgba(15,30,28,.10);
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 20px;
  --font-head:'Space Grotesk', 'Helvetica Neue', sans-serif;
  --font-body:'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1414;
    --surface:#121D1D;
    --ink:#EAF2F0;
    --ink-soft:#A9BEBB;
    --ink-faint:#6F8482;
    --line:#22322F;
    --line-strong:#324644;
    --brand:#3FA79A;
    --brand-ink:#0B211F;
    --brand-soft:#173330;
    --accent:#E0A64B;
    --accent-soft:#2C2313;
    --amarelo:#E0A64B;
    --amarelo-bg:#2C2313;
    --amarelo-line:#5A461F;
    --verde:#4FC988;
    --verde-bg:#123324;
    --verde-line:#1E5B3E;
    --vermelho:#E6746E;
    --vermelho-bg:#3A1918;
    --vermelho-line:#6B2C29;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 8px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1414;
  --surface:#121D1D;
  --ink:#EAF2F0;
  --ink-soft:#A9BEBB;
  --ink-faint:#6F8482;
  --line:#22322F;
  --line-strong:#324644;
  --brand:#3FA79A;
  --brand-ink:#0B211F;
  --brand-soft:#173330;
  --accent:#E0A64B;
  --accent-soft:#2C2313;
  --amarelo:#E0A64B;
  --amarelo-bg:#2C2313;
  --amarelo-line:#5A461F;
  --verde:#4FC988;
  --verde-bg:#123324;
  --verde-line:#1E5B3E;
  --vermelho:#E6746E;
  --vermelho-bg:#3A1918;
  --vermelho-line:#6B2C29;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.font-head{font-family:var(--font-head);letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--brand);color:#fff;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ============ Layout shells ============ */
#root{min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--brand-ink);color:#DCEDE9;
  padding:22px 16px;display:flex;flex-direction:column;gap:4px;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--brand),#0a3b37);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:#fff;font-size:15px;flex:none;}
.brand-name{font-family:var(--font-head);font-weight:600;font-size:15px;line-height:1.2;color:#fff;}
.brand-name small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:#8FB3AC;}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#BFDAD4;text-decoration:none;font-size:14.5px;cursor:pointer;border:none;background:none;text-align:left;width:100%;}
.nav-link svg{flex:none;width:18px;height:18px;opacity:.85;}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-link.active{background:var(--brand);color:#fff;}
.nav-sep{height:1px;background:rgba(255,255,255,.10);margin:12px 4px;}
.nav-group-label{font-size:11px;color:#6F958D;padding:10px 12px 4px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.10);}
.who{display:flex;align-items:center;gap:9px;padding:8px 10px;}
.who img{width:30px;height:30px;border-radius:50%;flex:none;}
.who-name{font-size:13px;color:#fff;font-weight:500;}
.who-role{font-size:11.5px;color:#8FB3AC;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:none;}
.content{flex:1;padding:32px 36px 90px;max-width:1180px;width:100%;margin:0 auto;}
.content.wide{max-width:1360px;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.page-head h1{font-size:24px;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--ink-soft);font-size:14px;}

.bottom-nav{display:none;}

@media (max-width: 900px){
  .sidebar{display:none;}
  .app-shell{display:block;}
  .main{flex:none;width:100%;min-height:100vh;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;}
  .content{padding:20px 16px 96px;}
  .page-head h1{font-size:20px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.05);
  }
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:none;background:none;color:var(--ink-faint);font-size:10.5px;flex:1;cursor:pointer;}
  .bn-item svg{width:21px;height:21px;}
  .bn-item.active{color:var(--brand);}
  .bn-item.cta{color:#fff;}
  .bn-fab{width:46px;height:46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;margin:-20px auto 2px;box-shadow:var(--shadow-2);color:#fff;}
}

/* ============ Components ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;transition:background .12s ease, border-color .12s ease, transform .04s ease;line-height:1.2;
  font-family:var(--font-body);
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:#0c4a45;}
.btn-primary:disabled{background:var(--line-strong);color:var(--ink-faint);cursor:not-allowed;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);}
.btn-secondary:hover{background:var(--paper);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--paper);}
.btn-danger{background:var(--vermelho-bg);color:var(--vermelho);border-color:var(--vermelho-line);}
.btn-danger:hover{filter:brightness(.97);}
.btn-approve{background:var(--verde);color:#fff;}
.btn-approve:hover{background:#186740;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
.field .err{font-size:12px;color:var(--vermelho);margin-top:5px;}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);
  color:var(--ink);font-size:14.5px;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);}
textarea{resize:vertical;min-height:72px;}
.input-money{position:relative;}
.input-money::before{content:'R$';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:14px;pointer-events:none;}
.input-money input{padding-left:38px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-aguardando{background:var(--amarelo-bg);color:var(--amarelo);border-color:var(--amarelo-line);}
.badge-aprovado{background:var(--verde-bg);color:var(--verde);border-color:var(--verde-line);}
.badge-reprovado{background:var(--vermelho-bg);color:var(--vermelho);border-color:var(--vermelho-line);}
.badge-ativo{background:var(--verde-bg);color:var(--verde);border-color:var(--verde-line);}
.badge-inativo{background:var(--paper);color:var(--ink-faint);border-color:var(--line);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{padding:18px 18px;}
.stat-card .num{font-family:var(--font-head);font-size:26px;font-weight:600;margin:2px 0 3px;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);}

.visit-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;}
.visit-row:last-child{border-bottom:none;}
.visit-row:hover{background:var(--paper);}
.visit-row .vr-main{flex:1;min-width:0;}
.visit-row .vr-cliente{font-weight:600;font-size:14.5px;}
.visit-row .vr-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.visit-row .vr-total{font-family:var(--font-mono);font-weight:600;font-size:14.5px;white-space:nowrap;}

.empty{text-align:center;padding:56px 20px;color:var(--ink-soft);}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;color:var(--ink-faint);}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
.empty p{margin:0 0 18px;font-size:13.5px;}

.wizard-progress{display:flex;align-items:center;gap:6px;margin-bottom:26px;}
.wp-step{display:flex;align-items:center;gap:8px;flex:1;}
.wp-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--paper);border:1.5px solid var(--line-strong);color:var(--ink-faint);flex:none;}
.wp-step.done .wp-dot{background:var(--brand);border-color:var(--brand);color:#fff;}
.wp-step.current .wp-dot{border-color:var(--brand);color:var(--brand);}
.wp-line{height:1.5px;flex:1;background:var(--line-strong);}
.wp-step.done + .wp-line, .wp-line.done{background:var(--brand);}
.wp-label{font-size:11.5px;color:var(--ink-faint);display:none;}
@media(min-width:640px){.wp-label{display:block;}}

.upload-box{border:1.5px dashed var(--line-strong);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--paper);}
.upload-box:hover{border-color:var(--brand);}
.upload-box svg{width:26px;height:26px;color:var(--ink-faint);margin-bottom:8px;}
.upload-box .u-title{font-size:13.5px;font-weight:600;}
.upload-box .u-sub{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.upload-preview{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
.upload-preview img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:var(--paper);}
.upload-preview .up-icon{width:52px;height:52px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;}
.upload-preview .up-info{flex:1;min-width:0;}
.upload-preview .up-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-preview .up-size{font-size:11.5px;color:var(--ink-faint);}

.summary-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.summary-line:last-child{border-bottom:none;}
.summary-line .sl-val{font-family:var(--font-mono);font-weight:600;}
.summary-total{display:flex;justify-content:space-between;padding:16px 0 4px;font-size:16px;font-weight:700;}
.summary-total .sl-val{font-family:var(--font-mono);}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.data-table th{text-align:left;padding:10px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);border-bottom:1.5px solid var(--line-strong);white-space:nowrap;cursor:pointer;user-select:none;}
.data-table th:hover{color:var(--brand);}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.data-table tr:hover td{background:var(--paper);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll-hint{display:none;}
@media(max-width:900px){.table-scroll-hint{display:block;font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;}}

.filters-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.filters-bar > *{min-width:0;}
.filters-bar select, .filters-bar input{width:auto;min-width:130px;}
@media(max-width:640px){.filters-bar{flex-direction:column;}.filters-bar select,.filters-bar input{width:100%;}}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,19,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:var(--radius-l);padding:26px;max-width:460px;width:100%;box-shadow:var(--shadow-2);max-height:88vh;overflow:auto;}
.modal h3{margin:0 0 6px;font-size:17px;}
.modal .modal-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

.sheet-overlay{position:fixed;inset:0;background:rgba(10,20,19,.4);z-index:100;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;padding:10px 8px 20px;max-height:78vh;overflow:auto;}
.sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:4px;margin:6px auto 10px;}
.sheet-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;font-size:15px;cursor:pointer;}
.sheet-item:hover{background:var(--paper);}
.sheet-item svg{width:19px;height:19px;color:var(--ink-soft);}

.toast-wrap{position:fixed;bottom:88px;left:0;right:0;display:flex;justify-content:center;z-index:200;pointer-events:none;}
@media(min-width:900px){.toast-wrap{bottom:28px;}}
.toast{background:var(--brand-ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-2);max-width:340px;}
.toast.error{background:var(--vermelho);}

.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;font-size:13px;color:var(--ink-soft);}
.pager .btn{padding:7px 12px;}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:5px 12px;border-radius:100px;border:1px solid var(--line-strong);font-size:12.5px;cursor:pointer;background:var(--surface);}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.split{grid-template-columns:1fr;}}

.helper-banner{background:var(--brand-soft);border:1px solid var(--verde-line);color:var(--brand-ink);border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:20px;}
:root[data-theme="dark"] .helper-banner, @media (prefers-color-scheme:dark){ .helper-banner{color:var(--ink);} }

.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{max-width:400px;width:100%;text-align:center;padding:40px 32px;}
.auth-logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(155deg,var(--brand),#0a3b37);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:22px;margin:0 auto 18px;}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--brand);animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.avatar{border-radius:50%;object-fit:cover;background:var(--paper);}
.hide{display:none !important;}
.text-soft{color:var(--ink-soft);}
.text-faint{color:var(--ink-faint);}
.mt-0{margin-top:0;}
</style>
</head>
<body>
<div id="root">
  <div class="center-screen"><div class="spinner"></div></div>
</div>
<script>
/* ===================================================================
   Controle de Visitas & Uber — lógica da aplicação
   =================================================================== */
(function(){
"use strict";

/* ---------- utilidades ---------- */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function esc(s){
  s = (s===undefined || s===null) ? '' : String(s);
  return s.replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtBRL(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if(!iso) return '—';
  var p = iso.split('-');
  if(p.length!==3) return iso;
  return p[2]+'/'+p[1]+'/'+p[0];
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{
    var d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function nowISO(){ return new Date().toISOString(); }
function monthKeyFromISO(iso){ return iso ? iso.slice(0,7) : ''; }
function currentMonthKey(){ return todayISO().slice(0,7); }
function rid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function humanSize(bytes){
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}
function dataUrlSizeBytes(dataUrl){
  var i = dataUrl.indexOf(',');
  var b64 = i>=0 ? dataUrl.slice(i+1) : dataUrl;
  return Math.floor(b64.length*0.75);
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx,args); }, ms);
  };
}
function statusLabel(s){
  return s==='aprovado' ? 'Aprovado' : s==='reprovado' ? 'Reprovado' : 'Aguardando';
}

/* ---------- toasts ---------- */
function toast(msg, isError){
  var wrap = $('#toast-wrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  var el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

/* ===================================================================
   Camada de dados (API REST própria) e autenticação por e-mail/senha
   =================================================================== */
(function(){
"use strict";
var U = window.APP;

var State = {
  ready:false,
  fatal:null,
  uid:null,
  me:{name:'', avatarUrl:'', color:'#0F5C56'},
  access:'loading', // loading | setup | login | disabled | ok
  loginError:'',
  setupError:'',
  role:null,
  usuariosCache:null,
  clientesCache:null,
  projetosCache:null,
  wizard:null,
  adminVisitasCache:null
};
window.STATE = State;

var TOKEN_KEY = 'cvUberToken';
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function colorForId(id){
  var palette = ['#0F5C56','#C98A2C','#1F7A4D','#7A4FB2','#2E6FA7','#B23A34','#0B7285'];
  var h = 0;
  for(var i=0;i<(id||'').length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
  return palette[h % palette.length];
}

/* ---------------- chamadas à API ---------------- */
async function api(method, path, body){
  var headers = {'Content-Type':'application/json'};
  var token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  var res;
  try{
    res = await fetch('/api'+path, {
      method:method, headers:headers, body: body!==undefined ? JSON.stringify(body) : undefined
    });
  }catch(networkErr){
    throw new Error('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.');
  }
  if(res.status===401){
    clearToken();
    State.access = 'login';
    State.uid = null; State.role = null;
    window.renderApp();
    throw new Error('Sua sessão expirou. Faça login novamente.');
  }
  var data = null;
  try{ data = await res.json(); }catch(e){ /* resposta sem corpo JSON */ }
  if(!res.ok){
    throw new Error((data && data.error) || ('Erro no servidor (HTTP '+res.status+').'));
  }
  return data;
}
var GET = function(p){ return api('GET', p); };
var POST = function(p,b){ return api('POST', p, b); };
var PATCH = function(p,b){ return api('PATCH', p, b); };
var PUT = function(p,b){ return api('PUT', p, b); };

/* ---------------- boot ---------------- */
async function boot(){
  try{
    var status = await GET('/auth/hasUsers');
    if(!status.hasUsers){
      State.access = 'setup';
      State.ready = true;
      window.renderApp();
      return;
    }
    var token = getToken();
    if(!token){
      State.access = 'login';
      State.ready = true;
      window.renderApp();
      return;
    }
    try{
      var me = await GET('/auth/me');
      applySession(me);
      State.access = 'ok';
    }catch(e){
      clearToken();
      State.access = 'login';
    }
  }catch(e){
    State.fatal = e.message || String(e);
  }
  State.ready = true;
  window.renderApp();
}
function applySession(u){
  State.uid = u.id;
  State.me = {name:u.nome, avatarUrl:'', color:colorForId(u.id)};
  State.role = u.perfil==='admin' ? 'admin' : 'colaborador';
}
async function login(email, senha){
  try{
    var res = await POST('/auth/login', {email:email, senha:senha});
    setToken(res.token);
    applySession(res.user);
    State.access = 'ok';
    State.loginError = '';
  }catch(e){
    State.loginError = e.message || String(e);
  }
  window.renderApp();
}
async function bootstrapAdmin(nome, email, senha){
  try{
    var res = await POST('/auth/bootstrap', {nome:nome, email:email, senha:senha});
    setToken(res.token);
    applySession(res.user);
    State.access = 'ok';
    return true;
  }catch(e){
    State.setupError = e.message || String(e);
    return false;
  }
}
function logout(){
  clearToken();
  State.uid = null; State.role = null; State.access = 'login';
  State.usuariosCache = null; State.clientesCache = null; State.projetosCache = null; State.adminVisitasCache = null;
  window.renderApp();
}
async function trocarSenha(senhaAtual, novaSenha){
  return POST('/auth/trocar-senha', {senhaAtual:senhaAtual, novaSenha:novaSenha});
}

/* ---------------- clientes ---------------- */
async function listClientes(force){
  if(State.clientesCache && !force) return State.clientesCache;
  var rows = await GET('/clientes');
  var list = rows.map(function(r){ return {id:r.id, nome:r.nome, codigo:r.codigo, observacao:r.observacao, ativo:r.ativo}; });
  list.sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
  State.clientesCache = list;
  return list;
}
async function createCliente(data){
  var r = await POST('/clientes', data);
  State.clientesCache = null;
  return r.id;
}
async function updateCliente(id, patch){
  await PATCH('/clientes/'+id, patch);
  State.clientesCache = null;
}

/* ---------------- projetos ---------------- */
async function listProjetos(force){
  if(State.projetosCache && !force) return State.projetosCache;
  var rows = await GET('/projetos');
  var list = rows.map(function(r){ return {id:r.id, nome:r.nome, codigo:r.codigo, clienteId:r.cliente_id, ativo:r.ativo}; });
  list.sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
  State.projetosCache = list;
  return list;
}
async function createProjeto(data){
  var r = await POST('/projetos', data);
  State.projetosCache = null;
  return r.id;
}
async function updateProjeto(id, patch){
  await PATCH('/projetos/'+id, patch);
  State.projetosCache = null;
}

/* ---------------- usuários ---------------- */
async function listUsuarios(force){
  if(State.usuariosCache && !force) return State.usuariosCache;
  var rows = await GET('/usuarios');
  var list = rows.map(function(r){ return {id:r.id, nome:r.nome, email:r.email, cargo:r.cargo, perfil:r.perfil, ativo:r.ativo, criadoEm:r.criadoEm}; });
  State.usuariosCache = list;
  return list;
}
async function addUsuario(data){
  var novo = await POST('/usuarios', data);
  State.usuariosCache = null;
  return novo; // inclui .senhaTemporaria
}
async function updateUsuario(id, patch){
  await PATCH('/usuarios/'+id, patch);
  State.usuariosCache = null;
  if(id===State.uid && patch.ativo===false){ logout(); }
}
async function resetarSenhaUsuario(id){
  var r = await POST('/usuarios/'+id+'/resetar-senha');
  return r.senhaTemporaria;
}

async function resolveProfiles(ids){
  var usuarios = State.role==='admin' ? await listUsuarios() : [{id:State.uid, nome:State.me.name}];
  var map = {};
  usuarios.forEach(function(u){ map[u.id] = {id:u.id, name:u.nome, avatarUrl:'', color:colorForId(u.id)}; });
  var out = {};
  (ids||[]).forEach(function(id){ if(id) out[id] = map[id] || {id:id, name:'', avatarUrl:'', color:'#888'}; });
  return out;
}

/* ---------------- visitas ---------------- */
async function getMinhasVisitas(){
  var list = await GET('/visitas/minhas');
  list.sort(function(a,b){ return (b.dataVisita||'').localeCompare(a.dataVisita||''); });
  return list;
}
async function getVisita(uid, id){
  return GET('/visitas/'+id);
}
async function criarVisita(payload){
  var r = await POST('/visitas', payload);
  return r.id;
}
async function atualizarVisita(uid, id, payload){
  await PUT('/visitas/'+id, payload);
}
async function getTodasVisitas(force){
  if(State.adminVisitasCache && !force && (Date.now()-State.adminVisitasCache.at < 15000)){
    return State.adminVisitasCache.list;
  }
  var list = await GET('/visitas/todas');
  list.sort(function(a,b){ return (b.dataVisita||'').localeCompare(a.dataVisita||''); });
  State.adminVisitasCache = {at:Date.now(), list:list};
  return list;
}
function invalidateAdminCache(){ State.adminVisitasCache = null; }
async function aprovarVisita(uid, id){
  await POST('/visitas/'+id+'/aprovar');
  invalidateAdminCache();
}
async function reprovarVisita(uid, id, motivo){
  await POST('/visitas/'+id+'/reprovar', {motivo:motivo});
  invalidateAdminCache();
}

/* ---------------- comprovantes (arquivo protegido, exige token) ---------------- */
async function fetchComprovanteBlobUrl(url){
  var headers = {};
  var token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  var res = await fetch(url, {headers:headers});
  if(!res.ok) throw new Error('Não foi possível carregar o comprovante.');
  var blob = await res.blob();
  return URL.createObjectURL(blob);
}

window.DATA = {
  boot:boot, login:login, bootstrapAdmin:bootstrapAdmin, logout:logout, trocarSenha:trocarSenha,
  listClientes:listClientes, createCliente:createCliente, updateCliente:updateCliente,
  listProjetos:listProjetos, createProjeto:createProjeto, updateProjeto:updateProjeto,
  listUsuarios:listUsuarios, addUsuario:addUsuario, updateUsuario:updateUsuario, resetarSenhaUsuario:resetarSenhaUsuario,
  resolveProfiles:resolveProfiles,
  getMinhasVisitas:getMinhasVisitas, getVisita:getVisita, criarVisita:criarVisita, atualizarVisita:atualizarVisita,
  getTodasVisitas:getTodasVisitas, invalidateAdminCache:invalidateAdminCache,
  aprovarVisita:aprovarVisita, reprovarVisita:reprovarVisita,
  fetchComprovanteBlobUrl:fetchComprovanteBlobUrl,
  getDownloadsCap:function(){ return null; }
};
})();

(function(){
"use strict";
var U = window.APP, S = window.STATE, D = window.DATA;

function initials(name){
  name = (name||'').trim();
  if(!name) return '?';
  var parts = name.split(/\s+/);
  return (parts[0][0] + (parts.length>1?parts[parts.length-1][0]:'')).toUpperCase();
}
function avatarHtml(profile, size){
  size = size||30;
  if(profile && profile.avatarUrl){
    return '<img class="avatar" src="'+U.esc(profile.avatarUrl)+'" width="'+size+'" height="'+size+'" alt="">';
  }
  var color = (profile && profile.color) || '#0F5C56';
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:'+Math.round(size*0.4)+'px;font-weight:700;font-family:var(--font-head)">'+U.esc(initials(profile&&profile.name))+'</div>';
}
function statusBadge(status){
  var cls = status==='aprovado'?'badge-aprovado':status==='reprovado'?'badge-reprovado':'badge-aguardando';
  return '<span class="badge '+cls+'">'+U.statusLabel(status)+'</span>';
}
function firstName(name){ return (name||'').trim().split(/\s+/)[0] || 'colaborador(a)'; }

/* ---------- navegação ---------- */
function navigate(hash){
  if(location.hash === hash){ renderApp(); }
  else { location.hash = hash; }
}
window.navigate = navigate;

function currentHash(){
  return (location.hash || '#/home').replace(/^#\//,'');
}

/* ---------- modais / sheets ---------- */
function openModal(innerHtml, onMount){
  closeOverlays();
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'active-modal';
  ov.innerHTML = '<div class="modal">'+innerHtml+'</div>';
  ov.addEventListener('mousedown', function(e){ if(e.target===ov) closeOverlays(); });
  document.body.appendChild(ov);
  if(onMount) onMount(ov);
}
function openSheet(items){
  closeOverlays();
  var ov = document.createElement('div');
  ov.className = 'sheet-overlay';
  ov.id = 'active-modal';
  var itemsHtml = items.map(function(it){
    return '<div class="sheet-item" data-sheet-nav="'+U.esc(it.hash)+'">'+U.ICON[it.icon]+'<span>'+U.esc(it.label)+'</span></div>';
  }).join('');
  ov.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>'+itemsHtml+'</div>';
  ov.addEventListener('mousedown', function(e){ if(e.target===ov) closeOverlays(); });
  ov.addEventListener('click', function(e){
    var t = e.target.closest('[data-sheet-nav]');
    if(t){ closeOverlays(); navigate('#/'+t.getAttribute('data-sheet-nav')); }
  });
  document.body.appendChild(ov);
}
function closeOverlays(){
  var el = document.getElementById('active-modal');
  if(el) el.remove();
}
function confirmDialog(opts){
  openModal(
    '<h3>'+U.esc(opts.title)+'</h3>'+
    '<p class="modal-sub">'+U.esc(opts.sub||'')+'</p>'+
    (opts.body||'')+
    '<div class="modal-actions">'+
      '<button class="btn btn-secondary" data-act="cancel">Cancelar</button>'+
      '<button class="btn '+(opts.danger?'btn-danger':'btn-primary')+'" data-act="confirm">'+U.esc(opts.confirmLabel||'Confirmar')+'</button>'+
    '</div>',
    function(ov){
      ov.querySelector('[data-act="cancel"]').onclick = closeOverlays;
      ov.querySelector('[data-act="confirm"]').onclick = function(){
        opts.onConfirm(ov);
      };
      if(opts.afterMount) opts.afterMount(ov);
    }
  );
}

/* ---------- imagem: compressão para caber no orçamento do doc ---------- */
function loadImage(url){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}
async function fileToAttachment(file){
  var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
  var base64, mimeType, name, previewDataUrl, sizeApprox;
  if(isPdf){
    previewDataUrl = await new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ res(r.result); };
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    sizeApprox = U.dataUrlSizeBytes(previewDataUrl);
    if(sizeApprox > 6*1024*1024){
      throw new Error('Este PDF tem '+U.humanSize(sizeApprox)+'. Use um arquivo de até 6 MB.');
    }
    mimeType = 'application/pdf';
    name = file.name || 'comprovante.pdf';
  } else {
    var objUrl = URL.createObjectURL(file);
    var img;
    try{ img = await loadImage(objUrl); } finally { URL.revokeObjectURL(objUrl); }
    var maxDim = 1600;
    var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width*scale));
    var h = Math.max(1, Math.round(img.height*scale));
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    var qualities = [0.85, 0.72, 0.6, 0.48, 0.36];
    var targetBytes = 450*1024;
    previewDataUrl = canvas.toDataURL('image/jpeg', qualities[0]);
    for(var i=0;i<qualities.length;i++){
      previewDataUrl = canvas.toDataURL('image/jpeg', qualities[i]);
      if(U.dataUrlSizeBytes(previewDataUrl) <= targetBytes) break;
    }
    sizeApprox = U.dataUrlSizeBytes(previewDataUrl);
    mimeType = 'image/jpeg';
    name = (file.name||'foto.jpg').replace(/\.\w+$/, '.jpg');
  }
  var base64Part = previewDataUrl.slice(previewDataUrl.indexOf(',')+1);
  return {
    dataUrl: previewDataUrl, base64: base64Part,
    name: name, type: mimeType, size: sizeApprox
  };
}

async function viewAttachmentLarge(att){
  if(!att) return;
  var src = att.dataUrl;
  if(!src && att.url){
    try{ src = await D.fetchComprovanteBlobUrl(att.url); }
    catch(e){ toast(e.message||String(e), true); return; }
  }
  if(!src) return;
  if(att.type === 'application/pdf'){
    var opened = window.open(src, '_blank');
    if(!opened){ toast('Habilite pop-ups para abrir o PDF em outra aba.', true); }
    return;

function bindAccessScreens(root){
  var b1 = root.querySelector('[data-act="bootstrap"]');
  if(b1) b1.onclick = async function(){
    var nome = root.querySelector('#setup-nome').value.trim();
    var email = root.querySelector('#setup-email').value.trim();
    var senha = root.querySelector('#setup-senha').value;
    if(!nome || !email || !senha){ toast('Preencha nome, e-mail e senha.', true); return; }
    b1.disabled = true; b1.textContent = 'Criando...';
    var ok = await D.bootstrapAdmin(nome, email, senha);
    if(!ok){ b1.disabled=false; b1.textContent='Criar conta de administrador(a)'; renderApp(); }
  };
  var b3 = root.querySelector('[data-act="login"]');
  if(b3){
    var doLogin = async function(){
      var email = root.querySelector('#login-email').value.trim();
      var senha = root.querySelector('#login-senha').value;
      if(!email || !senha){ toast('Preencha e-mail e senha.', true); return; }
      b3.disabled = true; b3.textContent = 'Entrando...';
      await D.login(email, senha);
    };
    b3.onclick = doLogin;
    ['#login-email','#login-senha'].forEach(function(sel){
      var input = root.querySelector(sel);
      if(input) input.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
    });
  }
  var b4 = root.querySelector('[data-act="voltar-login"]');
  if(b4) b4.onclick = function(){ D.logout(); };
}

      '<h3>Trocar senha</h3>'+

          var nova = ov.querySelector('#ts-nova').value;

function visitRowHtml(v, extra){
  extra = extra||{};
  var metaParts = [U.fmtDate(v.dataVisita)];

  if(v.projetoNome) metaParts.push(v.projetoNome);

function bindCommon(container){

      navigate('#/visita/'+parts[0]+'/'+parts[1]);
    });
  });
  container.querySelectorAll('[data-nav-btn]').forEach(function(el){

      if(h==='nova-visita'){ window.startNovaVisita(); } else { navigate('#/'+h); }
    });
  });
}
function selectOptions(list, valueKey, labelKey, selected, placeholder){
  var html = placeholder!==undefined ? '<option value="">'+esc(placeholder)+'</option>' : '';
  html += list.map(function(it){
    return '<option value="'+esc(it[valueKey])+'"'+(String(it[valueKey])===String(selected)?' selected':'')+'>'+esc(it[labelKey])+'</option>';
  }).join('');
  return html;
}
function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[;"\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
async function exportCsv(filename, headers, rows){
  var lines = [headers.map(csvEscape).join(';')];
  rows.forEach(function(r){ lines.push(r.map(csvEscape).join(';')); });
  var csv = '\uFEFF' + lines.join('\r\n');
  try{
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    SH.toast('Arquivo exportado.');
  }catch(e){
    SH.toast('Não foi possível exportar: '+(e.message||e), true);
  }
}

function wizardProgressHtml(step){
  var labels = ['Dados','Uber ida','Uber volta','Resumo'];
  var html = '<div class="wizard-progress">';
  for(var i=1;i<=4;i++){
    var cls = i<step ? 'done' : (i===step ? 'current' : '');
    html += '<div class="wp-step '+cls+'"><div class="wp-dot">'+(i<step?U.ICON.check:i)+'</div><div class="wp-label">'+labels[i-1]+'</div></div>';
    if(i<4) html += '<div class="wp-line'+(i<step?' done':'')+'"></div>';
  }
  html += '</div>';
  return html;
}

async function wizardStep1Html(){
  var w = S.wizard;
  var clientes = (await D.listClientes()).filter(function(c){ return c.ativo || c.id===w.clienteId; });
  var projetosAll = await D.listProjetos();

  return (clientes.length===0 ?

      '<button class="btn btn-ghost btn-sm" type="button" data-remove-att="'+key+'">'+U.ICON.trash+'</button>')+

function bindWizardEvents(container){
  var w = S.wizard;
  var cancelBtn = container.querySelector('[data-wiz="cancel"]');
  if(cancelBtn) cancelBtn.onclick = function(){ S.wizard=null; navigate(S.role==='admin' ? '#/admin' : '#/home'); };

  var backBtn = container.querySelector('[data-wiz="back"]');
  if(backBtn) backBtn.onclick = function(){ w.step -= 1; renderWizardStep(container); };

  var next1 = container.querySelector('[data-wiz="next1"]');
  if(next1) next1.onclick = async function(){
    var clienteSel = container.querySelector('#w-cliente');
    var dataInp = container.querySelector('#w-data');
    var projSel = container.querySelector('#w-projeto');
    var obsInp = container.querySelector('#w-obs');
    if(!clienteSel.value){ SH.toast('Selecione um cliente.', true); return; }
    if(!dataInp.value){ SH.toast('Informe a data da visita.', true); return; }
    w.clienteId = clienteSel.value;
    w.clienteNome = clienteSel.options[clienteSel.selectedIndex].text;
    w.dataVisita = dataInp.value;
    w.projetoId = projSel.value || '';
    w.projetoNome = projSel.value ? projSel.options[projSel.selectedIndex].text : '';
    w.observacao = obsInp.value.trim();
    w.step = 2;
    renderWizardStep(container);
  };
  var clienteSelLive = container.querySelector('#w-cliente');
  if(clienteSelLive) clienteSelLive.onchange = function(){
    w.clienteId = clienteSelLive.value;
    w.projetoId = ''; w.projetoNome = '';
    renderWizardStep(container);
  };

  ['ida','volta'].forEach(function(key){
    var uploadBox = container.querySelector('[data-upload="'+key+'"]');
    var fileInput = container.querySelector('#w-file-'+key);
    var handleFile = async function(){
      var f = fileInput.files[0];
      if(!f) return;
      var holder = uploadBox || container.querySelector('.upload-preview');
      if(holder) holder.classList.add('hide');
      var loadingMsg = document.createElement('div');
      loadingMsg.className = 'text-soft';
      loadingMsg.style.fontSize = '13px';
      loadingMsg.textContent = 'Processando comprovante...';
      if(holder) holder.parentNode.insertBefore(loadingMsg, holder.nextSibling);
      try{
        var att = await SH.fileToAttachment(f);
        w[key].att = att;
        renderWizardStep(container);
      }catch(err){
        loadingMsg.remove();
        if(holder) holder.classList.remove('hide');
        SH.toast(err.message || 'Não foi possível processar o arquivo.', true);
      }
    };
    if(uploadBox && fileInput){
      uploadBox.onclick = function(){ fileInput.click(); };
      fileInput.onchange = handleFile;
    }
    var replaceBtn = container.querySelector('[data-replace-att="'+key+'"]');
    if(replaceBtn && fileInput){
      replaceBtn.onclick = function(){ fileInput.click(); };
      fileInput.onchange = handleFile;
    }
    var viewBtn = container.querySelector('[data-view-att="'+key+'"]');
    if(viewBtn) viewBtn.onclick = function(){ SH.viewAttachmentLarge(shownAttFor(w[key]).att); };
    var rmBtn = container.querySelector('[data-remove-att="'+key+'"]');
    if(rmBtn) rmBtn.onclick = function(){ w[key].att = null; renderWizardStep(container); };

    var nextBtn = container.querySelector('[data-wiz="next'+key+'"]');
    if(nextBtn) nextBtn.onclick = function(){
      var valInp = container.querySelector('#w-valor-'+key);
      var val = parseFloat((valInp.value||'').replace(',','.'));
      if(!val || val<=0){ SH.toast('Informe o valor da corrida.', true); return; }
      if(!w[key].att && !w[key].existing){ SH.toast('Anexe o comprovante para continuar.', true); return; }
      w[key].valor = String(val);
      w.step = (key==='ida') ? 3 : 4;
      renderWizardStep(container);
    };
  });

  var submitBtn = container.querySelector('[data-wiz="submit"]');
  if(submitBtn) submitBtn.onclick = async function(){
    if(w.submitting) return;
    w.submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    try{
      function despesaFor(key){
        var d = {categoria:'Uber', tipo:key, valor:parseFloat(w[key].valor)||0};
        if(w[key].att){
          d.comprovanteBase64 = w[key].att.base64;
          d.comprovanteMime = w[key].att.type;
          d.comprovanteNome = w[key].att.name;
        }
        return d;
      }
      var despesaIda = despesaFor('ida');
      var despesaVolta = despesaFor('volta');
      var total = despesaIda.valor + despesaVolta.valor;
      var payload = {
        clienteId:w.clienteId, clienteNome:w.clienteNome,
        projetoId:w.projetoId||null, projetoNome:w.projetoNome||null,
        dataVisita:w.dataVisita, observacao:w.observacao||'',
        despesas:[despesaIda, despesaVolta], total:total
      };
      if(w.editing){
        await D.atualizarVisita(w.editing.uid, w.editing.id, payload);
        SH.toast('Prestação reenviada para aprovação.');
        D.invalidateAdminCache();
        var uidRes = w.editing.uid, idRes = w.editing.id;
        S.wizard = null;
        navigate('#/visita/'+uidRes+'/'+idRes);
      } else {
        var newId = await D.criarVisita(payload);
        SH.toast('Prestação enviada!');
        D.invalidateAdminCache();
        S.wizard = null;
        navigate('#/visita/'+S.uid+'/'+newId);
      }
    }catch(e){
      SH.toast(friendlyDbError(e), true);
      w.submitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = w.editing ? 'Reenviar prestação' : 'Enviar prestação';
    }
  };
}

function renderMinhasVisitasUI(container, visitas, clientes){
  var st = minhasState;
  var filtered = visitas.filter(function(v){
    if(st.mes && U.monthKeyFromISO(v.dataVisita)!==st.mes) return false;
    if(st.clienteId && v.clienteId!==st.clienteId) return false;
    if(st.status && v.status!==st.status) return false;
    return true;
  });
  var meses = Array.from(new Set(visitas.map(function(v){ return U.monthKeyFromISO(v.dataVisita); }))).sort().reverse();

  container.innerHTML =
    '<div class="page-head"><div><h1>Minhas visitas</h1><p>'+visitas.length+' registradas ao todo</p></div>'+

      '<select id="f-mes"><option value="">Todos os períodos</option>'+meses.map(function(m){ return '<option value="'+m+'"'+(m===st.mes?' selected':'')+'>'+mesLabel(m)+'</option>'; }).join('')+'</select>'+
      '<select id="f-cliente">'+selectOptions(clientes,'id','nome',st.clienteId,'Todos os clientes')+'</select>'+
      '<select id="f-status"><option value="">Todos os status</option>'+
        ['aguardando','aprovado','reprovado'].map(function(s){ return '<option value="'+s+'"'+(s===st.status?' selected':'')+'>'+U.statusLabel(s)+'</option>'; }).join('')+
      '</select>'+
    '</div>'+
    '<div class="card">'+
      (filtered.length ? filtered.map(function(v){ return visitRowHtml(v); }).join('') :
        emptyState('list','Nenhuma visita encontrada','Ajuste os filtros ou registre uma nova visita.', null, null))+
    '</div>';

  bindCommon(container);
  container.querySelector('#f-mes').onchange = function(e){ st.mes=e.target.value; renderMinhasVisitasUI(container, visitas, clientes); };
  container.querySelector('#f-cliente').onchange = function(e){ st.clienteId=e.target.value; renderMinhasVisitasUI(container, visitas, clientes); };
  container.querySelector('#f-status').onchange = function(e){ st.status=e.target.value; renderMinhasVisitasUI(container, visitas, clientes); };
}
function mesLabel(mk){
  if(!mk) return '';
  var parts = mk.split('-');
  var nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return nomes[parseInt(parts[1],10)-1]+'/'+parts[0];
}

var visitasListState = {filtro:{mes:'',clienteId:'',colaboradorId:'',projetoId:'',status:''}, sort:{campo:'dataVisita',dir:'desc'}, page:1};

async function pageAdminVisitas(container){
  var all = await D.getTodasVisitas();
  var clientes = await D.listClientes();
  var projetos = await D.listProjetos();
  var usuarios = await D.listUsuarios();
  var profiles = await D.resolveProfiles(usuarios.map(function(u){ return u.id; }));
  renderVisitasListUI(container, all, {clientes:clientes, projetos:projetos, usuarios:usuarios, profiles:profiles});
}

function renderVisitasListUI(container, all, ctx){
  var st = visitasListState;
  var filtered = all.filter(function(v){
    if(st.filtro.mes && U.monthKeyFromISO(v.dataVisita)!==st.filtro.mes) return false;
    if(st.filtro.clienteId && v.clienteId!==st.filtro.clienteId) return false;
    if(st.filtro.colaboradorId && v.colaboradorId!==st.filtro.colaboradorId) return false;
    if(st.filtro.projetoId && v.projetoId!==st.filtro.projetoId) return false;
    if(st.filtro.status && v.status!==st.filtro.status) return false;
    return true;
  });
  var dir = st.sort.dir==='asc' ? 1 : -1;
  filtered = filtered.slice().sort(function(a,b){
    var av,bv;
    if(st.sort.campo==='valor'){ av=a.total||0; bv=b.total||0; }
    else if(st.sort.campo==='cliente'){ av=a.clienteNome||''; bv=b.clienteNome||''; }
    else if(st.sort.campo==='colaborador'){ av=(ctx.profiles[a.colaboradorId]&&ctx.profiles[a.colaboradorId].name)||''; bv=(ctx.profiles[b.colaboradorId]&&ctx.profiles[b.colaboradorId].name)||''; }
    else { av=a.dataVisita||''; bv=b.dataVisita||''; }
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
  var pageSize = 15;
  var totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  if(st.page>totalPages) st.page = totalPages;
  var pageItems = filtered.slice((st.page-1)*pageSize, st.page*pageSize);
  var meses = Array.from(new Set(all.map(function(v){ return U.monthKeyFromISO(v.dataVisita); }))).sort().reverse();

  function th(label, field){
    var active = st.sort.campo===field;
    return '<th data-sort="'+field+'">'+esc(label)+(active ? (st.sort.dir==='asc'?' ▲':' ▼') : '')+'</th>';
  }

  container.innerHTML =
    '<div class="page-head"><div><h1>Todas as visitas</h1><p>'+filtered.length+' de '+all.length+' registros</p></div>'+
      '<button class="btn btn-secondary" id="btn-export-visitas">'+U.ICON.download+' Exportar CSV</button></div>'+
    '<div class="filters-bar">'+
      '<select id="f-mes"><option value="">Todos os períodos</option>'+meses.map(function(m){ return '<option value="'+m+'"'+(m===st.filtro.mes?' selected':'')+'>'+H.mesLabel(m)+'</option>'; }).join('')+'</select>'+
      '<select id="f-cliente">'+H.selectOptions(ctx.clientes,'id','nome',st.filtro.clienteId,'Todos os clientes')+'</select>'+
      '<select id="f-colaborador">'+H.selectOptions(ctx.usuarios.map(function(u){ return {id:u.id, nome:(ctx.profiles[u.id]&&ctx.profiles[u.id].name)||'—'}; }),'id','nome',st.filtro.colaboradorId,'Todos os colaboradores')+'</select>'+
      '<select id="f-projeto">'+H.selectOptions(ctx.projetos,'id','nome',st.filtro.projetoId,'Todos os projetos')+'</select>'+
      '<select id="f-status"><option value="">Todos os status</option>'+['aguardando','aprovado','reprovado'].map(function(s){ return '<option value="'+s+'"'+(s===st.filtro.status?' selected':'')+'>'+U.statusLabel(s)+'</option>'; }).join('')+'</select>'+
    '</div>'+
    '<div class="card">'+
      (pageItems.length===0 ? H.emptyState('list','Nenhum resultado','Ajuste os filtros para ver mais visitas.', null, null) :
        '<div class="table-scroll-hint">Arraste para o lado para ver mais colunas →</div>'+
        '<div class="table-wrap"><table class="data-table"><thead><tr>'+
          th('Data','dataVisita')+th('Colaborador(a)','colaborador')+th('Cliente','cliente')+'<th>Projeto</th>'+th('Total','valor')+'<th>Status</th><th></th>'+
        '</tr></thead><tbody>'+
        pageItems.map(function(v){
          var nome = (ctx.profiles[v.colaboradorId] && ctx.profiles[v.colaboradorId].name) || '—';
          return '<tr><td>'+U.fmtDate(v.dataVisita)+'</td><td>'+esc(nome)+'</td><td>'+esc(v.clienteNome||'—')+'</td><td>'+esc(v.projetoNome||'—')+'</td>'+
            '<td class="mono">R$ '+U.fmtBRL(v.total)+'</td><td>'+SH.statusBadge(v.status)+'</td>'+
            '<td><button class="btn btn-secondary btn-sm" data-open-visita="'+v.colaboradorId+'|'+v.id+'">Ver</button></td></tr>';
        }).join('')+
        '</tbody></table></div>'+
        '<div class="pager"><span>Página '+st.page+' de '+totalPages+'</span><div style="display:flex;gap:8px;">'+
          '<button class="btn btn-secondary btn-sm" id="pg-prev" '+(st.page<=1?'disabled':'')+'>'+U.ICON.chevronL+'</button>'+
          '<button class="btn btn-secondary btn-sm" id="pg-next" '+(st.page>=totalPages?'disabled':'')+'>'+U.ICON.chevronR+'</button>'+
        '</div></div>')+
    '</div>';

  H.bindCommon(container);
  container.querySelector('#f-mes').onchange = function(e){ st.filtro.mes=e.target.value; st.page=1; renderVisitasListUI(container, all, ctx); };
  container.querySelector('#f-cliente').onchange = function(e){ st.filtro.clienteId=e.target.value; st.page=1; renderVisitasListUI(container, all, ctx); };
  container.querySelector('#f-colaborador').onchange = function(e){ st.filtro.colaboradorId=e.target.value; st.page=1; renderVisitasListUI(container, all, ctx); };
  container.querySelector('#f-projeto').onchange = function(e){ st.filtro.projetoId=e.target.value; st.page=1; renderVisitasListUI(container, all, ctx); };
  container.querySelector('#f-status').onchange = function(e){ st.filtro.status=e.target.value; st.page=1; renderVisitasListUI(container, all, ctx); };
  container.querySelectorAll('[data-sort]').forEach(function(el){
    el.onclick = function(){
      var f = el.getAttribute('data-sort');
      if(st.sort.campo===f){ st.sort.dir = st.sort.dir==='asc'?'desc':'asc'; } else { st.sort.campo=f; st.sort.dir='asc'; }
      renderVisitasListUI(container, all, ctx);
    };
  });
  var prevBtn = container.querySelector('#pg-prev'); if(prevBtn) prevBtn.onclick = function(){ st.page--; renderVisitasListUI(container, all, ctx); };
  var nextBtn = container.querySelector('#pg-next'); if(nextBtn) nextBtn.onclick = function(){ st.page++; renderVisitasListUI(container, all, ctx); };
  container.querySelector('#btn-export-visitas').onclick = function(){
    H.exportCsv('visitas.csv', ['Data','Colaborador','Cliente','Projeto','Total','Status'], filtered.map(function(v){
      var nome = (ctx.profiles[v.colaboradorId] && ctx.profiles[v.colaboradorId].name) || '';
      return [U.fmtDate(v.dataVisita), nome, v.clienteNome||'', v.projetoNome||'', U.fmtBRL(v.total), U.statusLabel(v.status)];
    }));
  };
}

var IMPORT_CLIENTES_SUGESTAO = [
  'AEON','ALICE PAIVA','AMANDA MARTINS','BLOCO CHUCRUTE','COLÉGIO ARCADIA','DALF',
  'DR. GABRIELA SILVEIRA','DZ','EVOX','FutCross','GARDÊNIA VIVIAN','LAEVA',
  'METODO 3 EDIÇÃO','PIXAR','ROGÉRIO SARTINI','STEEL BAR','SW AUTO','TAG','VANESSA'
].join('\n');

function openImportClientesModal(existingClientes, onDone){
  SH.openModal(
    '<h3>Importar clientes em lote</h3>'+
    '<p class="modal-sub">Um nome de cliente por linha. Nomes iguais aos já cadastrados serão ignorados.</p>'+
    '<div class="field" style="margin-bottom:8px;"><textarea id="m-lista" rows="10" style="min-height:220px;font-family:var(--font-mono);font-size:13px;">'+esc(IMPORT_CLIENTES_SUGESTAO)+'</textarea></div>'+
    '<p id="m-import-status" class="text-soft" style="font-size:12.5px;margin:0;"></p>'+
    '<div class="modal-actions"><button class="btn btn-secondary" data-act="cancel">Cancelar</button><button class="btn btn-primary" data-act="save">Cadastrar todos</button></div>',
    function(ov){
      ov.querySelector('[data-act="cancel"]').onclick = SH.closeOverlays;
      ov.querySelector('[data-act="save"]').onclick = async function(){
        var saveBtn = ov.querySelector('[data-act="save"]');
        var statusEl = ov.querySelector('#m-import-status');
        var lines = ov.querySelector('#m-lista').value.split('\n')
          .map(function(l){ return l.trim(); })
          .filter(Boolean);
        var seen = {};
        var toCreate = [];
        lines.forEach(function(nome){
          var key = nome.toLowerCase();
          var jaExiste = existingClientes.some(function(c){ return (c.nome||'').trim().toLowerCase()===key; });
          if(!jaExiste && !seen[key]){ seen[key] = true; toCreate.push(nome); }
        });
        if(toCreate.length===0){ SH.toast('Nenhum cliente novo para cadastrar.', true); return; }
        saveBtn.disabled = true;
        var ok = 0, falhas = 0;
        for(var i=0;i<toCreate.length;i++){
          statusEl.textContent = 'Cadastrando '+(i+1)+' de '+toCreate.length+'...';
          try{ await D.createCliente({nome:toCreate[i], codigo:'', observacao:''}); ok++; }
          catch(e){ falhas++; }
        }
        SH.closeOverlays();
        SH.toast(ok+' cliente(s) cadastrado(s)'+(falhas?(', '+falhas+' falharam'):'')+'.', falhas>0 && ok===0);
        onDone();
      };
    }
  );
}

      var u = usuarios.find(function(x){ return x.id===btn.getAttribute('data-reset-senha'); });
      SH.confirmDialog({
        title:'Resetar senha de '+esc(u.nome)+'?',
        sub:'A senha atual dessa pessoa deixará de funcionar imediatamente.',
        confirmLabel:'Resetar senha',
        danger:true,
        onConfirm: async function(){
          try{
            var senha = await D.resetarSenhaUsuario(u.id);
            SH.closeOverlays();
            showSenhaModal(u.nome, senha);
          }catch(e){ SH.toast(H.friendlyDbError(e), true); }
        }
      });
    };
  });
}
function showSenhaModal(nome, senha){
  SH.openModal(
    '<h3>Senha temporária de '+esc(nome)+'</h3>'+
    '<p class="modal-sub">Envie esta senha para a pessoa. Ela pode trocá-la depois de entrar.</p>'+
    '<div class="mono" style="font-size:19px;font-weight:700;letter-spacing:1px;background:var(--paper);border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;text-align:center;margin-bottom:16px;word-break:break-all;">'+esc(senha)+'</div>'+
    '<div class="modal-actions"><span></span><button class="btn btn-primary" data-act="close">Fechar</button></div>',
    function(ov){ ov.querySelector('[data-act="close"]').onclick = SH.closeOverlays; }
  );
}
function openAddUsuarioModal(onSaved){
  SH.openModal(
    '<h3>Adicionar colaborador(a)</h3>'+
    '<div class="field"><label>Nome *</label><input type="text" id="m-nome" placeholder="Ex.: João Pereira"></div>'+
    '<div class="field"><label>E-mail *</label><input type="email" id="m-email" placeholder="joao@empresa.com"></div>'+
    '<div class="field"><label>Cargo</label><input type="text" id="m-cargo" placeholder="Ex.: Analista comercial"></div>'+
    '<div class="field" style="margin-bottom:0;"><label>Perfil</label><select id="m-perfil">'+
      '<option value="colaborador" selected>Colaborador(a)</option>'+
      '<option value="admin">Administrador(a)</option>'+
    '</select></div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" data-act="cancel">Cancelar</button><button class="btn btn-primary" data-act="save">Adicionar</button></div>',
    function(ov){
      ov.querySelector('[data-act="cancel"]').onclick = SH.closeOverlays;
      ov.querySelector('[data-act="save"]').onclick = async function(){
        var saveBtn = ov.querySelector('[data-act="save"]');
        var nome = ov.querySelector('#m-nome').value.trim();
        var email = ov.querySelector('#m-email').value.trim();
        if(!nome || !email){ SH.toast('Informe nome e e-mail.', true); return; }
        var data = {nome:nome, email:email, cargo:ov.querySelector('#m-cargo').value.trim(), perfil:ov.querySelector('#m-perfil').value};
        saveBtn.disabled = true;
        try{
          var novo = await D.addUsuario(data);
          SH.closeOverlays();
          onSaved();
          showSenhaModal(novo.nome, novo.senhaTemporaria);
        }catch(e){ SH.toast(H.friendlyDbError(e), true); saveBtn.disabled = false; }
      };
    }
  );
}
function openEditUsuarioModal(usuario, onSaved){
  SH.openModal(
    '<h3>Editar usuário</h3>'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">'+SH.avatarHtml({name:usuario.nome},36)+'<div><strong>'+esc(usuario.nome)+'</strong><div class="text-faint" style="font-size:12.5px;">'+esc(usuario.email)+'</div></div></div>'+
    '<div class="field"><label>Cargo</label><input type="text" id="m-cargo" value="'+esc(usuario.cargo)+'" placeholder="Ex.: Analista comercial"></div>'+
    '<div class="field"><label>Perfil</label><select id="m-perfil">'+
      '<option value="colaborador"'+(usuario.perfil==='colaborador'?' selected':'')+'>Colaborador(a)</option>'+
      '<option value="admin"'+(usuario.perfil==='admin'?' selected':'')+'>Administrador(a)</option>'+
    '</select></div>'+
    '<div class="field" style="margin-bottom:0;"><label>Status</label><select id="m-ativo">'+
      '<option value="1"'+(usuario.ativo?' selected':'')+'>Ativo</option><option value="0"'+(!usuario.ativo?' selected':'')+'>Inativo</option></select></div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" data-act="cancel">Cancelar</button><button class="btn btn-primary" data-act="save">Salvar</button></div>',

      ov.querySelector('[data-act="save"]').onclick = async function(){
        var saveBtn = ov.querySelector('[data-act="save"]');
        var data = {cargo:ov.querySelector('#m-cargo').value.trim(), perfil:ov.querySelector('#m-perfil').value, ativo: ov.querySelector('#m-ativo').value==='1'};
        saveBtn.disabled = true;
        try{
          await D.updateUsuario(usuario.id, data);
          SH.closeOverlays(); SH.toast('Usuário salvo.'); onSaved();
        }catch(e){ SH.toast(H.friendlyDbError(e), true); saveBtn.disabled = false; }
      };
    }
  );
}

/* =========================================================
   RELATÓRIOS
   ========================================================= */
var relatoriosState = {mes:'', clienteId:'', projetoId:'', colaboradorId:'', status:''};
async function pageAdminRelatorios(container){
  var all = await D.getTodasVisitas();
  var clientes = await D.listClientes();
  var projetos = await D.listProjetos();
  var usuarios = await D.listUsuarios();
  var profiles = await D.resolveProfiles(usuarios.map(function(u){ return u.id; }));
  renderRelatoriosUI(container, all, {clientes:clientes, projetos:projetos, usuarios:usuarios, profiles:profiles});
}
function groupSum(list, keyFn, labelFn){
  var map = {};
  list.forEach(function(v){
    var k = keyFn(v);
    if(!map[k]) map[k] = {label:labelFn(v), qtd:0, total:0};
    map[k].qtd += 1;
    map[k].total += (v.total||0);
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.total-a.total; });
}
function renderRelatoriosUI(container, all, ctx){
  var st = relatoriosState;
  var filtered = all.filter(function(v){
    if(st.mes && U.monthKeyFromISO(v.dataVisita)!==st.mes) return false;
    if(st.clienteId && v.clienteId!==st.clienteId) return false;
    if(st.projetoId && v.projetoId!==st.projetoId) return false;
    if(st.colaboradorId && v.colaboradorId!==st.colaboradorId) return false;
    if(st.status && v.status!==st.status) return false;
    return true;
  });
  var totalGasto = filtered.reduce(function(s,v){ return s+(v.total||0); }, 0);
  var totalIda = 0, totalVolta = 0;
  filtered.forEach(function(v){ (v.despesas||[]).forEach(function(d){ if(d.tipo==='ida') totalIda+=d.valor||0; if(d.tipo==='volta') totalVolta+=d.valor||0; }); });

  var porCliente = groupSum(filtered, function(v){ return v.clienteId||'-'; }, function(v){ return v.clienteNome||'—'; });
  var porColaborador = groupSum(filtered, function(v){ return v.colaboradorId; }, function(v){ return (ctx.profiles[v.colaboradorId]&&ctx.profiles[v.colaboradorId].name)||'—'; });
  var porProjeto = groupSum(filtered, function(v){ return v.projetoId||'-'; }, function(v){ return v.projetoNome||'Sem projeto'; });
  var porMes = groupSum(filtered, function(v){ return U.monthKeyFromISO(v.dataVisita); }, function(v){ return H.mesLabel(U.monthKeyFromISO(v.dataVisita)); });
  var meses = Array.from(new Set(all.map(function(v){ return U.monthKeyFromISO(v.dataVisita); }))).sort().reverse();

  function groupTable(title, rows){
    return '<div class="card" style="margin-bottom:16px;"><div style="padding:14px 18px;border-bottom:1px solid var(--line);"><h3 style="margin:0;font-size:14px;">'+title+'</h3></div>'+
      (rows.length===0 ? '<div style="padding:24px;text-align:center;" class="text-faint">Sem dados para os filtros selecionados.</div>' :
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>Visitas</th><th>Total</th></tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td>'+esc(r.label)+'</td><td>'+r.qtd+'</td><td class="mono">R$ '+U.fmtBRL(r.total)+'</td></tr>'; }).join('')+
      '</tbody></table></div>')+'</div>';
  }

  container.innerHTML =
    '<div class="page-head"><div><h1>Relatórios</h1><p>Análise de gastos com deslocamento</p></div>'+
      '<button class="btn btn-secondary" id="btn-export-rel">'+U.ICON.download+' Exportar CSV</button></div>'+
    '<div class="filters-bar">'+
      '<select id="r-mes"><option value="">Todos os períodos</option>'+meses.map(function(m){ return '<option value="'+m+'"'+(m===st.mes?' selected':'')+'>'+H.mesLabel(m)+'</option>'; }).join('')+'</select>'+
      '<select id="r-cliente">'+H.selectOptions(ctx.clientes,'id','nome',st.clienteId,'Todos os clientes')+'</select>'+
      '<select id="r-projeto">'+H.selectOptions(ctx.projetos,'id','nome',st.projetoId,'Todos os projetos')+'</select>'+
      '<select id="r-colaborador">'+H.selectOptions(ctx.usuarios.map(function(u){ return {id:u.id, nome:(ctx.profiles[u.id]&&ctx.profiles[u.id].name)||'—'}; }),'id','nome',st.colaboradorId,'Todos os colaboradores')+'</select>'+
      '<select id="r-status"><option value="">Todos os status</option>'+['aguardando','aprovado','reprovado'].map(function(s){ return '<option value="'+s+'"'+(s===st.status?' selected':'')+'>'+U.statusLabel(s)+'</option>'; }).join('')+'</select>'+
    '</div>'+
    '<div class="stat-grid">'+
      H.statCard('Visitas', filtered.length)+
      H.statCard('Total de gastos', 'R$ '+U.fmtBRL(totalGasto))+
      H.statCard('Total Uber ida', 'R$ '+U.fmtBRL(totalIda))+
      H.statCard('Total Uber volta', 'R$ '+U.fmtBRL(totalVolta))+
    '</div>'+
    groupTable('Por cliente', porCliente)+
    groupTable('Por colaborador', porColaborador)+
    groupTable('Por projeto', porProjeto)+
    groupTable('Por mês', porMes);

  function rerender(){ renderRelatoriosUI(container, all, ctx); }
  container.querySelector('#r-mes').onchange = function(e){ st.mes=e.target.value; rerender(); };
  container.querySelector('#r-cliente').onchange = function(e){ st.clienteId=e.target.value; rerender(); };
  container.querySelector('#r-projeto').onchange = function(e){ st.projetoId=e.target.value; rerender(); };
  container.querySelector('#r-colaborador').onchange = function(e){ st.colaboradorId=e.target.value; rerender(); };
  container.querySelector('#r-status').onchange = function(e){ st.status=e.target.value; rerender(); };
  container.querySelector('#btn-export-rel').onclick = function(){
    H.exportCsv('relatorio-visitas.csv', ['Data','Colaborador','Cliente','Projeto','Uber Ida','Uber Volta','Total','Status'], filtered.map(function(v){
      var ida = (v.despesas||[]).find(function(d){ return d.tipo==='ida'; });
      var volta = (v.despesas||[]).find(function(d){ return d.tipo==='volta'; });
      var nome = (ctx.profiles[v.colaboradorId] && ctx.profiles[v.colaboradorId].name) || '';
      return [U.fmtDate(v.dataVisita), nome, v.clienteNome||'', v.projetoNome||'', U.fmtBRL(ida?ida.valor:0), U.fmtBRL(volta?volta.valor:0), U.fmtBRL(v.total), U.statusLabel(v.status)];
    }));
  };
}

/* =========================================================
   ROTEADOR DE PÁGINAS
   ========================================================= */
async function renderPage(hash, container){
  var p1 = window.PAGES._part1;
  if(hash==='home') return p1.pageHome(container);
  if(hash==='nova-visita') return p1.pageNovaVisita(container);
  if(hash==='minhas-visitas') return p1.pageMinhasVisitas(container);
  if(hash.indexOf('visita/')===0){
    var parts = hash.slice('visita/'.length).split('/');
    return p1.pageVisitaDetalhe(container, parts);
  }
  if(hash==='admin') return pageAdminDashboard(container);
  if(hash==='admin/visitas') return pageAdminVisitas(container);
  if(hash==='admin/clientes') return pageAdminClientes(container);
  if(hash==='admin/projetos') return pageAdminProjetos(container);
  if(hash==='admin/usuarios') return pageAdminUsuarios(container);
  if(hash==='admin/relatorios') return pageAdminRelatorios(container);
  // rota desconhecida
  container.innerHTML = H.emptyState('alert','Página não encontrada','Essa página não existe.','Voltar para o início', S.role==='admin'?'admin':'home');
  H.bindCommon(container);
}
window.PAGES.render = renderPage;
})();

/* ---------------- boot final ---------------- */
(function(){
  window.addEventListener('hashchange', function(){ window.renderApp(); });
  window.DATA.boot();
})();

</script>
